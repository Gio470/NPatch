name: CI Build

on:
  workflow_dispatch:
  pull_request:
  push:
  merge_group:

jobs:
  build:
    name: 構建
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_HARDLINK: 'true'
      CCACHE_BASEDIR: '${{ github.workspace }}'

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        submodules: 'recursive'
        fetch-depth: 0

    - name: 🧙‍♂️ Pháp sư chế tạo SharedMemory Dex
      run: |
        mkdir -p out/shared_memory_dex
        
        # 1. Biên dịch Java (Vẫn dùng android.jar)
        javac -source 1.8 -target 1.8 \
          -bootclasspath $ANDROID_HOME/platforms/android-34/android.jar \
          src/android/os/SharedMemory.java
        
        # 2. Chuyển sang Dex (THÊM --lib ĐỂ D8 HẾT BỊ MÙ)
        $ANDROID_HOME/build-tools/34.0.0/d8 src/android/os/*.class \
          --lib $ANDROID_HOME/platforms/android-34/android.jar \
          --output out/shared_memory_dex/

    - name: 上傳 SharedMemory Dex
      uses: actions/upload-artifact@v5
      with:
        name: shared-memory-dex-${{ env.commit }} 
        path: out/shared_memory_dex/*
        retention-days: 7

    - name: 設定快取
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: 如果需要，則寫入簽名密鑰
      if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      run: |
        if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
        fi

    - name: 檢出 libxposed/api
      uses: actions/checkout@main
      with:
        repository: libxposed/api
        path: libxposed/api

    - name: 檢出 libxposed/service
      uses: actions/checkout@main
      with:
        repository: libxposed/service
        path: libxposed/service

    - name: 設定 Java
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: 設定 Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: 設定 Android SDK
      uses: android-actions/setup-android@v3

    - name: 設定 ninja
      uses: seanmiddleditch/gha-setup-ninja@master
      with:
        version: 1.12.1

    - name: 設定 CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.1.1'

    - name: 移除 Android 的 cmake
      shell: bash
      run: rm -rf "$ANDROID_HOME/cmake"

    - name: 設定構建環境
      run: |
        # for libxposed/api build
        echo 'org.gradle.jvmargs=-Xmx2048m' >> libxposed/api/gradle.properties

        # for main project build
        {
          echo 'org.gradle.parallel=true'
          echo 'org.gradle.jvmargs=-Xmx2048m'
          echo 'android.native.buildOutput=verbose'
        } >> gradle.properties

        # for libxposed build
        echo 'org.gradle.jvmargs=-Xmx2048m' >> libxposed/api/gradle.properties
        echo 'org.gradle.jvmargs=-Xmx2048m' >> libxposed/service/gradle.properties

    - name: 授予 gradlew 執行權限
      run: chmod +x gradlew

    - name: 使用 Gradle 構建依賴項
      working-directory: libxposed
      run: |
        cd api
        echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
        ./gradlew :api:publishApiPublicationToMavenLocal
        cd ../service
        echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
        ./gradlew :interface:publishInterfacePublicationToMavenLocal

    - name: 設定 commit id
      run: echo "commit=$(echo ${{ github.sha }} | cut -c-7)" > $GITHUB_ENV
                    
      # 🛡️ BƯỚC HACK TỔNG LỰC V7: BẮC CẦU C++ & ĐỊNH DANH LẠI TOÀN BỘ STUBS
    - name: Phap Thuat Stealth V7
      run: |
          echo "🦖 Đang triển khai đợt càn quét cuối cùng cho NPatch Android 7..."

          # --- PHẦN 1: BẮC CẦU C++ (GIỮ NGUYÊN V6) ---
          JNI_DIR="patch-loader/src/main/jni"
          REAL_CORE_PATH="../../../core/core/src/main/jni"
          if [ -d "$JNI_DIR" ]; then
            echo "🔗 Đang thiết lập cầu nối C++..."
            cd "$JNI_DIR" && rm -rf core && ln -s "$REAL_CORE_PATH" core && cd ../../../
          fi

          # --- PHẦN 2: DIỆT TẬN GỐC SUN.MISC (CHIẾN THUẬT CÀN QUÉT) ---
          echo "🔍 Đang truy quét xác ướp CompoundEnumeration..."
          
          # Tìm vị trí thực sự của file (bất kể nằm sâu cỡ nào trong Submodule)
          FILE_LOC=$(find . -name "CompoundEnumeration.java" | head -n 1)
          
          if [ -n "$FILE_LOC" ]; then
            echo "✅ Đã bắt sống mục tiêu tại: $FILE_LOC"
            
            # Tạo thư mục package mới: org.lsposed.stubs
            NEW_DIR="core/hiddenapi/stubs/src/main/java/org/lsposed/stubs"
            mkdir -p "$NEW_DIR"
            
            # Di chuyển file vào "vùng an toàn"
            mv "$FILE_LOC" "$NEW_DIR/CompoundEnumeration.java"
            
            # Thay đổi khai báo package bên trong file đó
            sed -i 's/package sun\.misc;/package org.lsposed.stubs;/g' "$NEW_DIR/CompoundEnumeration.java"
            
            # ÉP TOÀN BỘ DỰ ÁN thay đổi Import
            echo "🔗 Đang đồng bộ hóa toàn bộ mạch máu mã nguồn..."
            find . -type f -name "*.java" -exec sed -i 's/import sun\.misc\.CompoundEnumeration;/import org.lsposed.stubs.CompoundEnumeration;/g' {} +
            find . -type f -name "*.java" -exec sed -i 's/sun\.misc\.CompoundEnumeration/org.lsposed.stubs.CompoundEnumeration/g' {} +
          else
            echo "⚠️ Mục tiêu đã tẩu thoát hoặc đã được xử lý từ trước!"
          fi

          # --- PHẦN 3: KIỂM TRA CHỐNG LẶP TÊN (BẢO HIỂM CUỐI CÙNG) ---
          find . -type f -name "*.java" -exec sed -i 's/org\.lsposed\.stubs\.org\.lsposed\.stubs\./org.lsposed.stubs./g' {} +

          echo "🚀 Hệ thống đã được thanh tẩy hoàn toàn! NPatch Manager Android 7 KHAI HOẢ!"
          
    - name: 使用 Gradle 構建
      run: ./gradlew buildAll

    - name: 上傳 Release Artifact
      uses: actions/upload-artifact@v5
      with:
        name: npatch-release-${{ env.commit }}
        path: out/release/*
        retention-days: 14

    - name: 上傳 Debug Artifact
      uses: actions/upload-artifact@v5
      with:
        name: npatch-debug-${{ env.commit }}
        path: out/debug/*
        retention-days: 7

    - name: 上傳 mappings
      uses: actions/upload-artifact@v5
      with:
        name: mappings-${{ env.commit }}
        path: |
          patch-loader/build/outputs/mapping
          manager/build/outputs/mapping

    - name: 上傳 symbols
      uses: actions/upload-artifact@v5
      with:
        name: symbols-${{ env.commit }}
        path: |
          patch-loader/build/symbols
