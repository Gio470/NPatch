name: CI Build

on:
  workflow_dispatch:
  pull_request:
  push:
  merge_group:

jobs:
  build:
    name: 構建
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_HARDLINK: 'true'
      CCACHE_BASEDIR: '${{ github.workspace }}'

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        submodules: 'recursive'
        fetch-depth: 0

    - name: 🧙‍♂️ Pháp sư chế tạo SharedMemory Dex
      run: |
        mkdir -p out/shared_memory_dex
        
        # 1. Biên dịch Java (Vẫn dùng android.jar)
        javac -source 1.8 -target 1.8 \
          -bootclasspath $ANDROID_HOME/platforms/android-34/android.jar \
          src/android/os/SharedMemory.java
        
        # 2. Chuyển sang Dex (THÊM --lib ĐỂ D8 HẾT BỊ MÙ)
        $ANDROID_HOME/build-tools/34.0.0/d8 src/android/os/*.class \
          --lib $ANDROID_HOME/platforms/android-34/android.jar \
          --output out/shared_memory_dex/

    - name: 上傳 SharedMemory Dex
      uses: actions/upload-artifact@v5
      with:
        name: shared-memory-dex-${{ env.commit }} 
        path: out/shared_memory_dex/*
        retention-days: 7

    - name: 🛡️ Fix Submodule sun.misc
      run: |
          echo "🔍 Searching in submodules..."
          # Dùng find để quét toàn bộ, bất kể nó nằm sâu trong core hay submodule nào
          TARGET_FILE=$(find . -name "CompoundEnumeration.java" -path "*/sun/misc/*" | head -n 1)
          
          if [ -n "$TARGET_FILE" ]; then
            echo "✅ Target found: $TARGET_FILE"
            
            # 1. Xác định thư mục gốc của submodule chứa file đó
            # Giả định cấu trúc là .../src/main/java/sun/misc/...
            BASE_JAVA_DIR=$(echo "$TARGET_FILE" | sed 's|sun/misc/CompoundEnumeration.java||')
            NEW_DIR="${BASE_JAVA_DIR}internal/stubs"
            
            # 2. Tạo thư mục mới và di chuyển file
            mkdir -p "$NEW_DIR"
            mv "$TARGET_FILE" "$NEW_DIR/"
            
            # 3. Đổi package (Dùng dấu | thay cho / để sed không bị loạn)
            sed -i 's|package sun.misc;|package internal.stubs;|g' "$NEW_DIR/CompoundEnumeration.java"
            
            # 4. Sửa toàn bộ Import trong project
            echo "🔗 Syncing imports..."
            find . -type f -name "*.java" -exec sed -i 's|import sun.misc.CompoundEnumeration;|import internal.stubs.CompoundEnumeration;|g' {} +
            find . -type f -name "*.java" -exec sed -i 's|sun.misc.CompoundEnumeration|internal.stubs.CompoundEnumeration|g' {} +
            
            # 5. Xóa thư mục sun rỗng để tránh module jdk.unsupported nhận vơ
            rm -rf "${BASE_JAVA_DIR}sun"
            echo "🚀 Submodule fixed successfully!"
          else
            echo "⚠️ File not found. Check if submodules are checked out correctly."
          fi

    - name: ⚡ Hot-fix sun.net.www in Submodule
      run: |
          # 1. Định vị file gây lỗi
          TARGET_FILE="core/core/src/main/java/org/lsposed/lspd/util/ClassPathURLStreamHandler.java"
          
          if [ -f "$TARGET_FILE" ]; then
            echo "🎯 Đã tìm thấy mục tiêu, đang tiến hành 'phẫu thuật'..."
            
            # Đổi toàn bộ sun.net.www thành sunp.net.www (hoặc tên bất kỳ)
            sed -i 's/sun\.net\.www/sunp\.net\.www/g' "$TARGET_FILE"
            
            # 2. Tạo nhanh các file Stub ngay tại chỗ để trình biên dịch không kêu ca
            STUB_DIR="core/core/src/main/java/sunp/net/www/protocol/jar"
            mkdir -p "$STUB_DIR"
            
            # Tạo Stub cho ParseUtil
            echo -e "package sunp.net.www;\npublic class ParseUtil { public static String encodePath(String p, boolean b) { return p; } }" > "core/core/src/main/java/sunp/net/www/ParseUtil.java"
            
            # Tạo Stub cho Handler
            echo -e "package sunp.net.www.protocol.jar;\nimport java.net.URLStreamHandler;\npublic class Handler extends URLStreamHandler { protected java.net.URLConnection openConnection(java.net.URL u) { return null; } }" > "$STUB_DIR/Handler.java"
            
            echo "🚀 Đã 'vá' xong submodule mà không cần Fork!"
          fi

    - name: 設定快取
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: 如果需要，則寫入簽名密鑰
      if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      run: |
        if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
        fi

    - name: 檢出 libxposed/api
      uses: actions/checkout@main
      with:
        repository: libxposed/api
        path: libxposed/api

    - name: 檢出 libxposed/service
      uses: actions/checkout@main
      with:
        repository: libxposed/service
        path: libxposed/service

    - name: 設定 Java
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: 設定 Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: 設定 Android SDK
      uses: android-actions/setup-android@v3

    - name: 設定 ninja
      uses: seanmiddleditch/gha-setup-ninja@master
      with:
        version: 1.12.1

    - name: 設定 CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.1.1'

    - name: 移除 Android 的 cmake
      shell: bash
      run: rm -rf "$ANDROID_HOME/cmake"

    - name: 設定構建環境
      run: |
        # for libxposed/api build
        echo 'org.gradle.jvmargs=-Xmx2048m' >> libxposed/api/gradle.properties

        # for main project build
        {
          echo 'org.gradle.parallel=true'
          echo 'org.gradle.jvmargs=-Xmx2048m'
          echo 'android.native.buildOutput=verbose'
        } >> gradle.properties

        # for libxposed build
        echo 'org.gradle.jvmargs=-Xmx2048m' >> libxposed/api/gradle.properties
        echo 'org.gradle.jvmargs=-Xmx2048m' >> libxposed/service/gradle.properties

    - name: 授予 gradlew 執行權限
      run: chmod +x gradlew

    - name: 使用 Gradle 構建依賴項
      working-directory: libxposed
      run: |
        cd api
        echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
        ./gradlew :api:publishApiPublicationToMavenLocal
        cd ../service
        echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
        ./gradlew :interface:publishInterfacePublicationToMavenLocal

    - name: 設定 commit id
      run: echo "commit=$(echo ${{ github.sha }} | cut -c-7)" > $GITHUB_ENV
                    
    - name: 使用 Gradle 構建
      run: ./gradlew buildAll

    - name: 上傳 Release Artifact
      uses: actions/upload-artifact@v5
      with:
        name: npatch-release-${{ env.commit }}
        path: out/release/*
        retention-days: 14

    - name: 上傳 Debug Artifact
      uses: actions/upload-artifact@v5
      with:
        name: npatch-debug-${{ env.commit }}
        path: out/debug/*
        retention-days: 7

    - name: 上傳 mappings
      uses: actions/upload-artifact@v5
      with:
        name: mappings-${{ env.commit }}
        path: |
          patch-loader/build/outputs/mapping
          manager/build/outputs/mapping

    - name: 上傳 symbols
      uses: actions/upload-artifact@v5
      with:
        name: symbols-${{ env.commit }}
        path: |
          patch-loader/build/symbols
