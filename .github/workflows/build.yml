name: CI Build

on:
  workflow_dispatch:
  pull_request:
  push:
  merge_group:

jobs:
  build:
    name: 構建
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_HARDLINK: 'true'
      CCACHE_BASEDIR: '${{ github.workspace }}'

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        submodules: 'recursive'
        fetch-depth: 0

    - name: 🧙‍♂️ Pháp sư chế tạo SharedMemory Dex
      run: |
        mkdir -p out/shared_memory_dex
        
        # 1. Biên dịch Java (Vẫn dùng android.jar)
        javac -source 1.8 -target 1.8 \
          -bootclasspath $ANDROID_HOME/platforms/android-34/android.jar \
          src/android/os/SharedMemory.java
        
        # 2. Chuyển sang Dex (THÊM --lib ĐỂ D8 HẾT BỊ MÙ)
        $ANDROID_HOME/build-tools/34.0.0/d8 src/android/os/*.class \
          --lib $ANDROID_HOME/platforms/android-34/android.jar \
          --output out/shared_memory_dex/

    - name: 上傳 SharedMemory Dex
      uses: actions/upload-artifact@v5
      with:
        name: shared-memory-dex-${{ env.commit }} 
        path: out/shared_memory_dex/*
        retention-days: 7

    - name: 設定快取
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: 如果需要，則寫入簽名密鑰
      if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      run: |
        if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
        fi

    - name: 檢出 libxposed/api
      uses: actions/checkout@main
      with:
        repository: libxposed/api
        path: libxposed/api

    - name: 檢出 libxposed/service
      uses: actions/checkout@main
      with:
        repository: libxposed/service
        path: libxposed/service

    - name: 設定 Java
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: 設定 Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: 設定 Android SDK
      uses: android-actions/setup-android@v3

    - name: 設定 ninja
      uses: seanmiddleditch/gha-setup-ninja@master
      with:
        version: 1.12.1

    - name: 設定 CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.1.1'

    - name: 移除 Android 的 cmake
      shell: bash
      run: rm -rf "$ANDROID_HOME/cmake"

    - name: 設定構建環境
      run: |
        # for libxposed/api build
        echo 'org.gradle.jvmargs=-Xmx2048m' >> libxposed/api/gradle.properties

        # for main project build
        {
          echo 'org.gradle.parallel=true'
          echo 'org.gradle.jvmargs=-Xmx2048m'
          echo 'android.native.buildOutput=verbose'
        } >> gradle.properties

        # for libxposed build
        echo 'org.gradle.jvmargs=-Xmx2048m' >> libxposed/api/gradle.properties
        echo 'org.gradle.jvmargs=-Xmx2048m' >> libxposed/service/gradle.properties

    - name: 授予 gradlew 執行權限
      run: chmod +x gradlew

    - name: 使用 Gradle 構建依賴項
      working-directory: libxposed
      run: |
        cd api
        echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
        ./gradlew :api:publishApiPublicationToMavenLocal
        cd ../service
        echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
        ./gradlew :interface:publishInterfacePublicationToMavenLocal

    - name: 設定 commit id
      run: echo "commit=$(echo ${{ github.sha }} | cut -c-7)" > $GITHUB_ENV
                    
      # 🛡️ BƯỚC HACK TỔNG LỰC V8: BẮC CẦU C++ & ĐỔI TÊN SUNP.MICSP 😈
    - name: Phap Thuat Stealth V8
      run: |
          echo "🦖 Đang thực hiện thuật tráo thân: sun.misc -> sunp.micsp!"

          # --- PHẦN 1: BẮC CẦU C++ (GIỮ CHO C KHÔNG ĐỘT TỬ) ---
          JNI_DIR="patch-loader/src/main/jni"
          REAL_CORE_PATH="../../../core/core/src/main/jni"
          if [ -d "$JNI_DIR" ]; then
            echo "🔗 Thiết lập cầu nối C++..."
            cd "$JNI_DIR" && rm -rf core && ln -s "$REAL_CORE_PATH" core && cd ../../../
          fi

          # --- PHẦN 2: CHIẾN THUẬT "SUNP.MICSP" (TRÁO TÊN THƯ MỤC) ---
          echo "🔍 Truy lùng hang ổ sun/misc..."
          
          # 1. Tìm và đổi tên thư mục gốc của stub
          OLD_DIR="core/hiddenapi/stubs/src/main/java/sun/misc"
          NEW_DIR="core/hiddenapi/stubs/src/main/java/sunp/micsp"
          
          if [ -d "$OLD_DIR" ]; then
            echo "✅ Đã bắt sống hang ổ, đang tiến hành đổi tên thư mục..."
            mkdir -p "core/hiddenapi/stubs/src/main/java/sunp"
            mv "$OLD_DIR" "$NEW_DIR"
            # Xóa thư mục sun rỗng nếu cần
            rm -rf "core/hiddenapi/stubs/src/main/java/sun"
          fi

          # 2. Sửa nội dung file: Đổi package bên trong
          if [ -f "$NEW_DIR/CompoundEnumeration.java" ]; then
            echo "📝 Đang ghi đè package mới: sunp.micsp"
            sed -i 's/^package sun\.misc;/package sunp.micsp;/g' "$NEW_DIR/CompoundEnumeration.java"
          fi

          # 3. ÉP TOÀN BỘ DỰ ÁN (Sửa sạch import)
          echo "🔗 Đang đồng bộ hóa import trên toàn bộ mặt trận..."
          find . -type f -name "*.java" -exec sed -i 's/\bimport sun\.misc\.CompoundEnumeration;/import sunp.micsp.CompoundEnumeration;/g' {} +
          find . -type f -name "*.java" -exec sed -i 's/\bsun\.misc\.CompoundEnumeration/sunp.micsp.CompoundEnumeration/g' {} +
          
          # Bảo hiểm cuối cùng: Sửa những chỗ lỡ bị sửa sai ở các bản V trước
          find . -type f -name "*.java" -exec sed -i 's/org\.lsposed\.stubs\.sun\.misc/sunp.micsp/g' {} +

          echo "🚀 Tên mới đã được đăng ký! sunp.micsp đã sẵn sàng vượt biên!"
          
    - name: 使用 Gradle 構建
      run: ./gradlew buildAll

    - name: 上傳 Release Artifact
      uses: actions/upload-artifact@v5
      with:
        name: npatch-release-${{ env.commit }}
        path: out/release/*
        retention-days: 14

    - name: 上傳 Debug Artifact
      uses: actions/upload-artifact@v5
      with:
        name: npatch-debug-${{ env.commit }}
        path: out/debug/*
        retention-days: 7

    - name: 上傳 mappings
      uses: actions/upload-artifact@v5
      with:
        name: mappings-${{ env.commit }}
        path: |
          patch-loader/build/outputs/mapping
          manager/build/outputs/mapping

    - name: 上傳 symbols
      uses: actions/upload-artifact@v5
      with:
        name: symbols-${{ env.commit }}
        path: |
          patch-loader/build/symbols
